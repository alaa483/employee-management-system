<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - نظام إدارة الموظفين</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                👥
            </div>

            <h1>نظام إدارة الموظفين</h1>

            <p class="login-description">
                سجل الدخول للوصول إلى لوحة التحكم
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">اسم المستخدم</label>

                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>

                </div>

                <div class="form-group">

                    <label for="password">كلمة المرور</label>

                    <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password"
                        required>

                </div>

                <p id="loginMessage" class="login-message" role="alert"></p>

                <button type="submit" id="loginButton">
                    تسجيل الدخول
                </button>

            </form>

            <div class="login-footer">
                نظام إدارة الموارد البشرية © 2026
            </div>

        </div>

    </main>

    <script src="/js/login.js"></script>

</body>

</html>
